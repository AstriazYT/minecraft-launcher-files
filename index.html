<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radiant - Launcher</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #0d0e15;
            color: #ffffff;
            display: flex;
            overflow: hidden;
            -webkit-app-region: drag;
        }

        /* Menu latéral ultra épuré */
        .side-menu {
            width: 80px;
            background: rgba(0, 0, 0, 0.4);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 0;
        }

        /* Logo épuré style minimaliste */
        .brand-logo {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ff416c;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        .menu-icon {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.4);
            transition: background 0.2s, color 0.2s;
            -webkit-app-region: no-drag;
            cursor: pointer;
        }

        .menu-icon:hover, .menu-icon.active {
            background: rgba(255, 65, 108, 0.15);
            color: #ff416c;
        }

        /* Zone principale */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            position: relative;
            padding: 40px;
        }

        /* Fond immersif Survie */
        .hero-section {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0d0e15 0%, #1a1c29 100%);
            z-index: -1;
        }

        /* Panneau central / Titre */
        .server-hero-info {
            margin-bottom: 40px;
        }

        .server-title {
            font-size: 56px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #ff4b2b, #ff416c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .server-subtitle {
            font-size: 15px;
            color: #8b90a0;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Panneau de lancement */
        .action-box {
            background: rgba(13, 14, 21, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 600px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .status-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #8b90a0;
        }

        #status-text {
            font-weight: 500;
        }

        #percent-text {
            font-weight: 700;
            color: #ff416c;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff4b2b, #ff416c);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .btn-launch {
            width: 100%;
            height: 50px;
            background: linear-gradient(90deg, #ff4b2b 0%, #ff416c 100%);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 65, 108, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            -webkit-app-region: no-drag;
        }

        .btn-launch:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 65, 108, 0.45);
        }

        .btn-launch:active {
            transform: translateY(0);
        }

        .btn-launch:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <!-- Menu latéral épuré -->
    <div class="side-menu">
        <div class="brand-logo">R</div>
        <div class="menu-icon active" title="Accueil">🏠</div>
        <div class="menu-icon" title="Paramètres">⚙️</div>
    </div>

    <!-- Zone principale -->
    <div class="main-content">
        <div class="hero-section"></div>

        <div class="server-hero-info">
            <h1 class="server-title">Radiant</h1>
            <p class="server-subtitle">Serveur Survie Multijoueur</p>
        </div>

        <div class="action-box">
            <div class="status-container">
                <span id="status-text">Prêt à jouer</span>
                <span id="percent-text"></span>
            </div>

            <div class="progress-bar-bg">
                <div id="progress-fill" class="progress-bar-fill"></div>
            </div>

            <button id="play-btn" class="btn-launch">JOUER</button>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        const playBtn = document.getElementById('play-btn');
        const statusText = document.getElementById('status-text');
        const percentText = document.getElementById('percent-text');
        const progressFill = document.getElementById('progress-fill');

        playBtn.addEventListener('click', () => {
            playBtn.disabled = true;
            playBtn.innerText = 'LANCEMENT...';
            statusText.innerText = 'Initialisation...';
            percentText.innerText = '0%';
            progressFill.style.width = '0%';
            ipcRenderer.send('launch-game');
        });

        ipcRenderer.on('status', (event, data) => {
            if (typeof data === 'string') {
                statusText.innerText = data;
            } else if (typeof data === 'object') {
                if (data.text) statusText.innerText = data.text;
                if (data.percent !== undefined) {
                    progressFill.style.width = data.percent + '%';
                    percentText.innerText = Math.round(data.percent) + '%';
                }
            }
        });
    </script>
</body>
</html>
