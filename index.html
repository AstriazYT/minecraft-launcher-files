<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radiant Launcher</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #0b0c10;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px;
            overflow: hidden;
            -webkit-app-region: drag;
        }

        .window-controls {
            position: absolute;
            top: 15px;
            right: 20px;
            display: flex;
            gap: 12px;
            -webkit-app-region: no-drag;
        }

        .win-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 16px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .win-btn:hover {
            color: #ffffff;
        }

        .center-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .logo-box {
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .logo-box::after {
            content: '';
            position: absolute;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ff4b2b, #ff416c);
            filter: blur(40px);
            opacity: 0.3;
            z-index: -1;
        }

        .logo-text {
            font-size: 80px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff4b2b 0%, #ff416c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }

        .server-name {
            font-size: 14px;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
        }

        .bottom-container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            -webkit-app-region: no-drag;
        }

        .status-info {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        #status-text {
            font-weight: 500;
        }

        #percent-text {
            font-weight: 700;
            color: #ff416c;
        }

        .progress-bar-bg {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff4b2b, #ff416c);
            transition: width 0.3s ease;
        }

        .btn-action {
            width: 100%;
            height: 48px;
            background: linear-gradient(90deg, #ff4b2b 0%, #ff416c 100%);
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 65, 108, 0.3);
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
        }

        .btn-action:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 25px rgba(255, 65, 108, 0.5);
        }

        .btn-action:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .help-link {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            text-decoration: none;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.2s;
            margin-top: 5px;
        }

        .help-link:hover {
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>

    <div class="window-controls">
        <button class="win-btn" id="close-btn">✕</button>
    </div>

    <div class="center-container">
        <div class="logo-box">
            <span class="logo-text">R</span>
        </div>
        <div class="server-name" id="user-display">Radiant Survie</div>
    </div>

    <div class="bottom-container">
        <div class="status-info">
            <span id="status-text">En attente de connexion...</span>
            <span id="percent-text"></span>
        </div>

        <div class="progress-bar-bg">
            <div id="progress-fill" class="progress-bar-fill"></div>
        </div>

        <!-- Au début, le bouton sert à se connecter Microsoft -->
        <button id="main-btn" class="btn-action">SE CONNECTER (MICROSOFT)</button>
        
        <a href="#" class="help-link">Problème lors de la connexion ?</a>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        const mainBtn = document.getElementById('main-btn');
        const statusText = document.getElementById('status-text');
        const percentText = document.getElementById('percent-text');
        const progressFill = document.getElementById('progress-fill');
        const userDisplay = document.getElementById('user-display');
        const closeBtn = document.getElementById('close-btn');

        let currentState = 'LOGIN'; // 'LOGIN' puis 'PLAY'

        closeBtn.addEventListener('click', () => {
            window.close();
        });

        mainBtn.addEventListener('click', () => {
            if (currentState === 'LOGIN') {
                mainBtn.disabled = true;
                mainBtn.innerText = 'CONNEXION EN COURS...';
                statusText.innerText = 'Ouverture de la fenêtre Microsoft...';
                ipcRenderer.send('microsoft-login');
            } else if (currentState === 'PLAY') {
                mainBtn.disabled = true;
                mainBtn.innerText = 'LANCEMENT...';
                statusText.innerText = 'Préparation du jeu...';
                percentText.innerText = '0%';
                progressFill.style.width = '0%';
                ipcRenderer.send('launch-game');
            }
        });

        // Quand la connexion Microsoft est réussie
        ipcRenderer.on('login-success', (event, username) => {
            currentState = 'PLAY';
            userDisplay.innerText = `Connecté : ${username}`;
            statusText.innerText = 'Prêt à jouer';
            mainBtn.disabled = false;
            mainBtn.innerText = 'JOUER';
        });

        // Suivi de la progression du lancement du jeu
        ipcRenderer.on('status', (event, data) => {
            if (typeof data === 'string') {
                statusText.innerText = data;
            } else if (typeof data === 'object') {
                if (data.text) statusText.innerText = data.text;
                if (data.percent !== undefined) {
                    progressFill.style.width = data.percent + '%';
                    percentText.innerText = Math.round(data.percent) + '%';
                }
            }
        });
    </script>
</body>
</html>
